name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
      - name: Run unit and publication tests
        run: python3 -m unittest discover -s tests -v
      - name: Parse first-party remote card
        run: node --check custom_components/samsung_ip_control/frontend/samsung-ip-remote-card.js

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Run Ruff
        run: ruff check . && ruff format --check .

  home-assistant-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
      - name: Install tested Home Assistant
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-home-assistant.txt
      - name: Import every integration module
        run: python3 -c 'import custom_components.samsung_ip_control; import custom_components.samsung_ip_control.config_flow; import custom_components.samsung_ip_control.diagnostics; import custom_components.samsung_ip_control.frontend; import custom_components.samsung_ip_control.media_player; import custom_components.samsung_ip_control.remote; import custom_components.samsung_ip_control.services; import custom_components.samsung_ip_control.text_client'
      - name: Run Home Assistant API tests
        run: python3 -m unittest tests.test_home_assistant_api -v
